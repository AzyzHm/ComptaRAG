<section class="auth">
  <div class="auth__card">
    <h1 class="auth__title">
      {{ mode() === 'sign-in' ? 'Sign in to ComptaRAG' : 'Create your ComptaRAG account' }}
    </h1>
    <p class="auth__subtitle">IFRS &amp; Tunisian fiscal law, grounded.</p>

    @if (error()) {
      <p class="auth__error" role="alert">{{ error() }}</p>
    }

    <form class="auth__form" (ngSubmit)="submit()">
      <div class="auth__field">
        <label for="auth-email" class="auth__label">Email</label>
        <input
          id="auth-email"
          class="auth__input"
          type="email"
          name="email"
          autocomplete="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          [disabled]="pending()"
          required
        />
      </div>

      <div class="auth__field">
        <label for="auth-password" class="auth__label">Password</label>
        <div class="auth__input-wrapper">
          <input
            id="auth-password"
            class="auth__input auth__input--with-action"
            [type]="passwordVisible() ? 'text' : 'password'"
            name="password"
            [autocomplete]="mode() === 'sign-in' ? 'current-password' : 'new-password'"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            [disabled]="pending()"
            required
          />
          <button
            type="button"
            class="auth__reveal"
            [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="passwordVisible()"
            [disabled]="pending()"
            (click)="togglePasswordVisibility()"
          >
            @if (passwordVisible()) {
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M3 3l18 18M10.6 10.7a2.5 2.5 0 0 0 3.5 3.5M9.4 5.5A10.6 10.6 0 0 1 12 5c5 0 9 4 10.5 7-.6 1.2-1.5 2.5-2.7 3.7M6.7 6.7C4.6 8.1 3 10 1.5 12c1.7 3.4 5.5 7 10.5 7 1.4 0 2.7-.3 3.9-.8"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M1.5 12C3 8.5 7 5 12 5s9 3.5 10.5 7C21 15.5 17 19 12 19S3 15.5 1.5 12Z"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linejoin="round"
                />
                <circle cx="12" cy="12" r="2.75" stroke="currentColor" stroke-width="1.7" />
              </svg>
            }
          </button>
        </div>
      </div>

      <app-button
        type="submit"
        [fullWidth]="true"
        [disabled]="pending() || !email().trim() || !password()"
      >
        {{ pending() ? 'Please wait…' : mode() === 'sign-in' ? 'Sign in' : 'Create account' }}
      </app-button>
    </form>

    <div class="auth__divider"><span>or</span></div>

    <app-button
      variant="secondary"
      [fullWidth]="true"
      [disabled]="pending()"
      (clicked)="continueWithGoogle()"
    >
      Continue with Google
    </app-button>

    <button type="button" class="auth__toggle" (click)="toggleMode()" [disabled]="pending()">
      {{
        mode() === 'sign-in'
          ? "Don't have an account? Create one"
          : 'Already have an account? Sign in'
      }}
    </button>
  </div>
</section>
