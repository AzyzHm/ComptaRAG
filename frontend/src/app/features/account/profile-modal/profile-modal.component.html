<app-modal title="Your profile" (closed)="close()">
  @if (error()) {
    <p class="profile-form__error" role="alert">{{ error() }}</p>
  }
  @if (success()) {
    <p class="profile-form__success" role="status">{{ success() }}</p>
  }

  <form class="profile-form" (ngSubmit)="submit()">
    <fieldset class="profile-form__section" [disabled]="pending()">
      <legend class="profile-form__legend">Account</legend>

      <div class="profile-form__field">
        <label for="profile-display-name" class="profile-form__label">Username</label>
        <input
          id="profile-display-name"
          class="profile-form__input"
          type="text"
          name="displayName"
          autocomplete="name"
          [ngModel]="displayName()"
          (ngModelChange)="displayName.set($event)"
        />
      </div>

      <div class="profile-form__field">
        <label for="profile-email" class="profile-form__label">Email</label>
        <input
          id="profile-email"
          class="profile-form__input"
          type="email"
          name="email"
          autocomplete="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
        />
      </div>
    </fieldset>

    <fieldset class="profile-form__section" [disabled]="pending()">
      <legend class="profile-form__legend">Change password</legend>
      <p class="profile-form__hint">Leave blank to keep your current password.</p>

      <div class="profile-form__field">
        <label for="profile-new-password" class="profile-form__label">New password</label>
        <input
          id="profile-new-password"
          class="profile-form__input"
          [type]="passwordFieldsVisible() ? 'text' : 'password'"
          name="newPassword"
          autocomplete="new-password"
          [ngModel]="newPassword()"
          (ngModelChange)="newPassword.set($event)"
        />
      </div>

      <div class="profile-form__field">
        <label for="profile-confirm-password" class="profile-form__label">
          Confirm new password
        </label>
        <input
          id="profile-confirm-password"
          class="profile-form__input"
          [type]="passwordFieldsVisible() ? 'text' : 'password'"
          name="confirmNewPassword"
          autocomplete="new-password"
          [ngModel]="confirmNewPassword()"
          (ngModelChange)="confirmNewPassword.set($event)"
        />
      </div>
    </fieldset>

    <fieldset class="profile-form__section" [disabled]="pending()">
      <legend class="profile-form__legend">Confirm it's you</legend>
      <p class="profile-form__hint">Required to change your email or password.</p>

      <div class="profile-form__field">
        <label for="profile-current-password" class="profile-form__label"> Current password </label>
        <div class="profile-form__input-wrapper">
          <input
            id="profile-current-password"
            class="profile-form__input profile-form__input--with-action"
            [type]="passwordFieldsVisible() ? 'text' : 'password'"
            name="currentPassword"
            autocomplete="current-password"
            [ngModel]="currentPassword()"
            (ngModelChange)="currentPassword.set($event)"
          />
          <button
            type="button"
            class="profile-form__reveal"
            [attr.aria-label]="passwordFieldsVisible() ? 'Hide passwords' : 'Show passwords'"
            [attr.aria-pressed]="passwordFieldsVisible()"
            (click)="togglePasswordFieldsVisibility()"
          >
            @if (passwordFieldsVisible()) {
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M3 3l18 18M10.6 10.7a2.5 2.5 0 0 0 3.5 3.5M9.4 5.5A10.6 10.6 0 0 1 12 5c5 0 9 4 10.5 7-.6 1.2-1.5 2.5-2.7 3.7M6.7 6.7C4.6 8.1 3 10 1.5 12c1.7 3.4 5.5 7 10.5 7 1.4 0 2.7-.3 3.9-.8"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M1.5 12C3 8.5 7 5 12 5s9 3.5 10.5 7C21 15.5 17 19 12 19S3 15.5 1.5 12Z"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linejoin="round"
                />
                <circle cx="12" cy="12" r="2.75" stroke="currentColor" stroke-width="1.7" />
              </svg>
            }
          </button>
        </div>
      </div>
    </fieldset>

    <app-button type="submit" [fullWidth]="true" [disabled]="pending()">
      {{ pending() ? 'Saving…' : 'Save changes' }}
    </app-button>
  </form>
</app-modal>
