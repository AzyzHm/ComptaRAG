<header class="app-header">
  <div class="app-header__brand-group">
    <a [routerLink]="authService.isAuthenticated() ? '/chat' : '/'" class="app-header__brand">
      <img src="/logo.png" alt="" class="app-header__logo" />
      ComptaRAG
    </a>
    <span class="app-header__tagline">IFRS &amp; Tunisian fiscal law, grounded</span>
  </div>

  <div class="app-header__right">
    <app-theme-toggle />

    @if (authService.isAuthenticated()) {
      <div class="app-header__account">
        @if (authService.role() === 'ADMIN' || authService.role() === 'SUPER_ADMIN') {
          <a routerLink="/admin/users" class="app-header__nav-link">Admin</a>
        }

        <button type="button" class="app-header__user" (click)="openProfileModal()">
          <span class="app-header__user-name">
            {{ authService.profile()?.display_name || authService.profile()?.email }}
          </span>
          @if (authService.role(); as role) {
            <app-role-badge [role]="role" />
          }
        </button>

        <app-button variant="secondary" (clicked)="logout()">Log out</app-button>
      </div>
    } @else if (!authService.isInitializing()) {
      <a routerLink="/login" class="app-header__nav-link">Sign in</a>
    }
  </div>
</header>

@if (profileModalOpen()) {
  <app-profile-modal (closed)="closeProfileModal()" />
}
